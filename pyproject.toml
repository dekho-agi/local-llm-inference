[project]
name = "llmctl"
version = "0.1.0"
description = "Toolkit for local LLM inference, wired into opencode"
requires-python = ">=3.11"
# The CLI itself needs these at runtime and they are pure Python, so they
# belong here, not in an extra: a bare `pip install -e .` previously left
# typer/rich missing and every command died with ModuleNotFoundError.
# mlx-lm is NOT here — it is Apple-silicon only, so it stays in the `apple`
# extra and CI on Linux can still install this package.
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "huggingface_hub>=1.0",
]

[project.optional-dependencies]
apple = ["mlx-lm>=0.31.3", "huggingface_hub>=1.0"]
test = ["pytest>=8"]

[project.scripts]
llmctl = "llmctl.cli:app"

[tool.setuptools.packages.find]
include = ["llmctl*"]

[tool.setuptools.package-data]
llmctl = ["catalog.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
