[project]
name = "llmctl"
version = "0.1.0"
description = "Toolkit for local LLM inference, wired into opencode"
requires-python = ">=3.11"
# Runtime deps all arrive with mlx-lm, which is platform-specific (Apple
# silicon). They are declared as an optional extra so tests can run in CI on
# Linux without pulling Metal wheels.
dependencies = []

[project.optional-dependencies]
apple = ["mlx-lm>=0.31.3", "huggingface_hub>=1.0"]
test = ["pytest>=8", "typer>=0.12", "rich>=13", "huggingface_hub>=1.0"]

[project.scripts]
llmctl = "llmctl.cli:app"

[tool.setuptools.packages.find]
include = ["llmctl*"]

[tool.setuptools.package-data]
llmctl = ["catalog.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
