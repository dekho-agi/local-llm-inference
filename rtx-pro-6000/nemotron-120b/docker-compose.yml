services:
  nemotron-120b:
    image: nvcr.io/nvidia/vllm:26.03.post1-py3
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
    command: >
      vllm serve nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4
      --dtype auto
      --quantization modelopt
      --kv-cache-dtype fp8
      --trust-remote-code
      --tensor-parallel-size ${TENSOR_PARALLEL_SIZE:-1}
      --max-model-len ${MAX_MODEL_LEN:-32768}
      --gpu-memory-utilization ${GPU_MEMORY_UTILIZATION:-0.90}
      --enable-auto-tool-choice
      --tool-call-parser hermes
      --host 0.0.0.0
      --port 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 600s
    restart: unless-stopped

volumes:
  huggingface_cache:

# OpenAI-compatible endpoint: http://localhost:8000/v1/chat/completions
# Model: nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4 (12.7B active params, MoE)
#
# HARDWARE REQUIREMENTS:
#   NVFP4 weights = ~60 GB -> fits on single RTX Pro 6000 Blackwell (96 GB, SM 12.0)
#   Requires Blackwell (SM 9.0+); Ada Lovelace (SM89) does NOT support NVFP4 MoE layers.
#
#   Two-GPU FP8 alternative: use nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-FP8
#     with TENSOR_PARALLEL_SIZE=2 on 2x RTX Pro 6000 (96 GB each).
